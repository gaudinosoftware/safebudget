<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeBudget</title>
<meta name="description" content="Know what's safe to spend, every day.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #ffffff;
    --text: #1c1c1e;
    --secondary: #6c6c70;
    --accent: #e0457b;
    --card: #f2f2f7;
    --rule: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --text: #f2f2f7;
      --secondary: #98989f;
      --accent: #ff6a9a;
      --card: #1c1c1e;
      --rule: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  .updated { color: var(--secondary); margin: 0 0 28px; font-size: 15px; }
  .summary {
    background: var(--card);
    border-radius: 18px;
    padding: 18px 22px;
    margin: 0 0 36px;
  }
  .summary p { margin: 0 0 8px; font-weight: 600; }
  .summary ul { margin: 0; padding-left: 20px; }
  .summary li { margin: 4px 0; }
  h2 {
    font-size: 21px;
    margin: 36px 0 8px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    letter-spacing: -0.01em;
  }
  p, li { color: var(--text); }
  ul { padding-left: 22px; }
  li { margin: 6px 0; }
  a { color: var(--accent); }
  footer { color: var(--secondary); font-size: 15px; margin-top: 44px; }
</style>
<style>
  .hero { text-align: center; padding-top: 24px; }
  .hero img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 32px rgba(224,69,123,0.28); }
  .hero h1 { margin-top: 20px; }
  .hero p { color: var(--secondary); font-size: 19px; margin: 6px 0 0; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 32px 0 0; }
  .links a {
    background: var(--card); color: var(--text); text-decoration: none; font-weight: 600;
    padding: 12px 22px; border-radius: 999px;
  }
  .contact { background: var(--card); border-radius: 18px; padding: 18px 22px; margin: 0 0 8px; }
  .contact p { margin: 0; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="icon.png" alt="SafeBudget icon">
    <h1>SafeBudget</h1>
    <p>Know what&rsquo;s safe to spend, every day.</p>
  </div>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</main>
</body>
</html>
